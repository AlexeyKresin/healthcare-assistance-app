<!DOCTYPE html>
<html>
<head>
    <title>Search Programs</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Search Healthcare Assistance Programs</h1>

<nav>
    <a href="/">Home</a> |
    <a href="/search">Search Programs</a> |
    <a href="/programs">View Programs</a> |
    <a href="/add-user">Add User</a> |
    <a href="/add-application">Add Application</a> |
    <a href="/reports">Reports</a> |
    <a href="/about">About</a>
</nav>


<img src="{{ url_for('static', filename='logo.png') }}" class="logo">

<hr>

<form action="/results" method="GET">

    <div class="form-row">
        <label>Program Type:</label>
        <select name="type">
            <option value="">-- Any Type --</option>
            <option value="Medication Support">Medication Support</option>
            <option value="Insurance Support">Insurance Support</option>
            <option value="Financial Aid">Financial Aid</option>
            <option value="Emergency Grant">Emergency Grant</option>
            <option value="Care Support">Care Support</option>
            <option value="Treatment Assistance">Treatment Assistance</option>
        </select>
    </div>

    <div class="form-row">
        <label>Eligibility Category:</label>
        <select name="eligibility">
            <option value="">-- Any Eligibility --</option>
            <option value="Income">Income Based</option>
            <option value="children">Children / Family</option>
            <option value="65">Senior / Medicare Age</option>
            <option value="emergency">Emergency Need</option>
            <option value="Pregnant">Maternal Care</option>
            <option value="chronic illness">Chronic Illness</option>
        </select>
    </div>

    <button type="submit">Search</button>

</form>

</body>
</html>
