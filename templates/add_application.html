<!DOCTYPE html>
<html>
<head>
    <title>Add Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-row label {
            width: 150px;
            font-weight: bold;
        }

        .form-row select,
        .form-row input {
            width: 250px;
            padding: 6px;
        }

        button {
            margin-left: 150px;
            padding: 8px 18px;
        }
    </style>
</head>
<body>

<h1>Add Application</h1>

<nav>
    <a href="/">Home</a> |
    <a href="/search">Search Programs</a> |
    <a href="/programs">View Programs</a> |
    <a href="/add-user">Add User</a> |
    <a href="/add-application">Add Application</a> |
    <a href="/reports">Reports</a> |
    <a href="/about">About</a>
</nav>

<hr>

<form method="POST">

    <div class="form-row">
        <label>User:</label>
        <select name="user_id">
            {% for u in users %}
            <option value="{{ u[0] }}">{{ u[1] }} {{ u[2] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-row">
        <label>Program:</label>
        <select name="program_id">
            {% for p in programs %}
            <option value="{{ p[0] }}">{{ p[1] }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-row">
        <label>Date:</label>
        <input type="date" name="date" required>
    </div>

    <button type="submit">Submit Application</button>

</form>

</body>
</html>
